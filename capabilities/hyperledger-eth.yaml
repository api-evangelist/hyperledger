naftiko: 1.0.0-alpha2
info:
  label: Hyperledger Besu JSON-RPC API — Eth
  description: 'Hyperledger Besu JSON-RPC API — Eth. 1 operations. Lead operation: JSON-RPC endpoint. Self-contained Naftiko
    capability covering one Hyperledger business surface.'
  tags:
  - Hyperledger
  - Eth
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    HYPERLEDGER_API_KEY: HYPERLEDGER_API_KEY
capability:
  consumes:
  - type: http
    namespace: hyperledger-eth
    baseUri: https://besu.example.com
    description: Hyperledger Besu JSON-RPC API — Eth business capability. Self-contained, no shared references.
    resources:
    - name: root
      path: /
      operations:
      - name: jsonrpccall
        method: POST
        description: JSON-RPC endpoint
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: hyperledger-eth-rest
    port: 8080
    description: REST adapter for Hyperledger Besu JSON-RPC API — Eth. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1
      name: root
      description: REST surface for root.
      operations:
      - method: POST
        name: jsonrpccall
        description: JSON-RPC endpoint
        call: hyperledger-eth.jsonrpccall
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: hyperledger-eth-mcp
    port: 9090
    transport: http
    description: MCP adapter for Hyperledger Besu JSON-RPC API — Eth. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: json-rpc-endpoint
      description: JSON-RPC endpoint
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: hyperledger-eth.jsonrpccall
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
