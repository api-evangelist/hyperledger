- aid: hyperledger:hyperledger-fabric-api
  name: Hyperledger Fabric API
  description: >-
    Hyperledger Fabric is a permissioned distributed ledger platform. Programmatic access is provided
    via the Fabric Gateway, peer gRPC APIs, and SDKs for chaincode invocation, ledger queries, and channel
    administration.
