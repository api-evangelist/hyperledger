aid: hyperledger
name: Hyperledger
description: >-
  Hyperledger is an open source collaborative effort created to advance cross-industry blockchain technologies,
  originally hosted under the Linux Foundation and now stewarded by LF Decentralized Trust. It hosts enterprise-grade
  blockchain frameworks including Fabric, Besu, Indy, Iroha, and Cacti, along with tools like Firefly and Caliper for
  blockchain development, identity, and operations.
