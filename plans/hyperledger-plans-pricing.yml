specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Hyperledger
providerId: hyperledger
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: true
tags:
  - Blockchain
  - Distributed Ledger
  - Open Source
  - Linux Foundation
  - Smart Contracts
description: Hyperledger (now stewarded by LF Decentralized Trust under the Linux Foundation) is
  a free open-source ecosystem of blockchain frameworks and tools (Fabric, Besu, Indy, Iroha, Cacti,
  Firefly, etc). The projects themselves carry no license fee, no API consumption charges, and no
  per-call rate limits imposed by the foundation. Commercial offerings are sold separately by member
  vendors (IBM Blockchain Platform, Kaleido, Oracle Blockchain, R3, ConsenSys, etc) and are out of
  scope for the foundation pricing surface. Linux Foundation membership tiers fund the foundation
  but are not API consumption tiers.
sources:
  - https://lfdecentralizedtrust.org/projects
  - https://www.hyperledger.org/
  - https://www.hyperledger.org/about/charter
plans:
  - id: hyperledger-open-source
    name: Open Source (Apache 2.0)
    type: freemium
    description: All Hyperledger / LF Decentralized Trust projects are released under the Apache
      License 2.0 (or compatible OSI licenses). There is no foundation-imposed runtime cost, license
      fee, or call-based pricing for self-hosted deployments.
    entries:
      - label: Self-hosted node / chaincode runtime
        name: self_hosted
        type: flat
        metric: node
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Hyperledger Fabric
      - name: Hyperledger Besu
      - name: Hyperledger Indy
      - name: Hyperledger Iroha
      - name: Hyperledger Cacti
      - name: Hyperledger Firefly
      - name: Hyperledger Caliper
      - name: Apache 2.0 license
      - name: Community support (mailing lists, Discord, GitHub)
  - id: hyperledger-lf-membership
    name: LF Decentralized Trust Membership
    type: subscription
    description: Linux Foundation membership tiers (Premier, General, Associate) fund the foundation
      and provide governance participation rather than API consumption rights. Membership pricing
      is not API pricing and is published separately by the LF.
    entries:
      - label: Membership dues
        name: membership_dues
        type: subscription
        metric: year
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: see https://lfdecentralizedtrust.org/membership
        userMultiplied: false
    elements:
      - name: Governance and voting rights
      - name: Marketing co-promotion
      - name: Training and certification discounts
      - name: Not API consumption pricing
  - id: hyperledger-commercial-vendors
    name: Member Commercial Offerings
    type: enterprise
    description: Managed-service and enterprise-supported builds are sold by ecosystem vendors (IBM,
      Oracle, AWS Managed Blockchain, Kaleido, Hyperledger Iroha vendors, etc). These prices vary
      per vendor and are not published by the Hyperledger / LF Decentralized Trust foundation.
    entries:
      - label: Vendor-priced offering
        name: vendor_offering
        type: subscription
        metric: varies
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: see vendor (e.g. IBM Blockchain, Kaleido, AWS Managed Blockchain)
        userMultiplied: false
    elements:
      - name: IBM Blockchain Platform / IBM Cloud
      - name: AWS Managed Blockchain
      - name: Oracle Blockchain Platform
      - name: Kaleido
      - name: ConsenSys (Besu)
      - name: R3 (Corda interop via Cacti)
maintainers:
